[package]
name = "green-bond"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kyc-whitelist = { path = "../kyc-whitelist" }

[features]
testutils = ["soroban-sdk/testutils"]
