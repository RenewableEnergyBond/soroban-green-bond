[package]
name = "coupon-redemption"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
green-bond = { path = "../green-bond" }

[features]
testutils = ["soroban-sdk/testutils"]
coupon-tools = ["dep:serde_json"]

[[bin]]
name = "coupon-snapshot"
path = "src/bin/coupon_snapshot.rs"
required-features = ["coupon-tools"]
